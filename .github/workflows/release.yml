name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: zip -r scalefish-ui.zip dist/

      - uses: softprops/action-gh-release@v2
        with:
          files: scalefish-ui.zip
          generate_release_notes: true
